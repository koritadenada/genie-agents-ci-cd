# Pull request: unit tests, then deploy the changed agent to dev and run its benchmarks.
# Make "Genie benchmarks (dev)" a required status check on main, so a pull request cannot be merged
# while accuracy is not above the threshold. The job always runs (a skipped job could satisfy a required
# check) and fails until the repository variable GENIE_CICD_ENABLED is set to true (see README, Set up).
name: Genie Agent pull request

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write # GitHub OIDC token for Databricks workload identity federation
  contents: read

concurrency:
  group: genie-dev
  cancel-in-progress: false

jobs:
  benchmarks-dev:
    name: Genie benchmarks (dev)
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
    steps:
      - name: CI enabled
        if: vars.GENIE_CICD_ENABLED != 'true'
        run: |
          echo "::error::Set the repository variable GENIE_CICD_ENABLED to true once the setup in the README is done."
          exit 1
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.26.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Environment settings (alert email required; catalog and schema optional)
        env:
          ALERT_EMAIL: ${{ secrets.GENIE_ALERT_EMAIL }}
          CATALOG: ${{ vars.CATALOG }}
          SCHEMA: ${{ vars.SCHEMA }}
        run: |
          if [[ "$ALERT_EMAIL" != *@* ]]; then
            echo "::error::Set the repository secret GENIE_ALERT_EMAIL to the address that gets the email when the benchmark gate fails."
            exit 1
          fi
          echo "BUNDLE_VAR_alert_email=$ALERT_EMAIL" >> "$GITHUB_ENV"
          if [ -n "$CATALOG" ]; then echo "BUNDLE_VAR_catalog=$CATALOG" >> "$GITHUB_ENV"; fi
          if [ -n "$SCHEMA" ]; then echo "BUNDLE_VAR_schema=$SCHEMA" >> "$GITHUB_ENV"; fi

      - name: Validate the bundle
        run: databricks bundle validate --target dev

      - name: Seed example data (only when SEED_EXAMPLE_DATA is true)
        if: vars.SEED_EXAMPLE_DATA == 'true'
        run: python scripts/seed_demo_data.py --target dev

      - name: Deploy the agent and its benchmarks to dev
        run: databricks bundle deploy --target dev

      - name: Benchmark gate (fails when accuracy is not above the threshold)
        run: scripts/run_gate.sh dev
