# Merge to main: deploy to staging, run the benchmarks, and promote to prod only when they pass.
# If accuracy is not above the threshold, the gate prints the failing questions and reasons, Databricks
# emails the team (GENIE_ALERT_EMAIL), the staging job fails and the prod job never starts.
# Each deployment applies exactly the plan it shows (bundle plan, then deploy --plan); the plans are kept
# as workflow artifacts. Nothing runs until the repository variable GENIE_CICD_ENABLED is set to true.
name: Genie Agent release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: genie-release
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy to staging and run benchmarks
    if: vars.GENIE_CICD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.26.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Environment settings (alert email required; catalog and schema optional)
        env:
          ALERT_EMAIL: ${{ secrets.GENIE_ALERT_EMAIL }}
          CATALOG: ${{ vars.CATALOG }}
          SCHEMA: ${{ vars.SCHEMA }}
        run: |
          if [[ "$ALERT_EMAIL" != *@* ]]; then
            echo "::error::Set the repository secret GENIE_ALERT_EMAIL to the address that gets the email when the benchmark gate fails."
            exit 1
          fi
          echo "BUNDLE_VAR_alert_email=$ALERT_EMAIL" >> "$GITHUB_ENV"
          if [ -n "$CATALOG" ]; then echo "BUNDLE_VAR_catalog=$CATALOG" >> "$GITHUB_ENV"; fi
          if [ -n "$SCHEMA" ]; then echo "BUNDLE_VAR_schema=$SCHEMA" >> "$GITHUB_ENV"; fi
      - name: Validate the bundle
        run: databricks bundle validate --target staging
      - name: Seed example data (only when SEED_EXAMPLE_DATA is true)
        if: vars.SEED_EXAMPLE_DATA == 'true'
        run: python scripts/seed_demo_data.py --target staging
      - name: Plan
        run: scripts/plan.sh staging
      - name: Redacted copy of the plan for review (the alert address is removed)
        run: jq 'walk(if type == "object" and has("email_notifications") then .email_notifications = "<redacted>" else . end)' plan-staging.json > plan-staging-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan-staging
          path: plan-staging-review.json
          retention-days: 30
      - name: Deploy the plan to staging
        run: databricks bundle deploy --target staging --plan plan-staging.json --auto-approve
      - name: Benchmark gate (accuracy must be above the threshold)
        run: scripts/run_gate.sh staging

  prod:
    name: Promote to prod
    needs: staging # runs only when the staging benchmark gate passed
    runs-on: ubuntu-latest
    # Limit this environment to the main branch (Settings > Environments > prod), so a pull request can never
    # authenticate as the prod service principal. Add required reviewers for a manual approval before prod.
    environment: prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.26.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Environment settings (alert email required; catalog and schema optional)
        env:
          ALERT_EMAIL: ${{ secrets.GENIE_ALERT_EMAIL }}
          CATALOG: ${{ vars.CATALOG }}
          SCHEMA: ${{ vars.SCHEMA }}
        run: |
          if [[ "$ALERT_EMAIL" != *@* ]]; then
            echo "::error::Set the repository secret GENIE_ALERT_EMAIL to the address that gets the email when the benchmark gate fails."
            exit 1
          fi
          echo "BUNDLE_VAR_alert_email=$ALERT_EMAIL" >> "$GITHUB_ENV"
          if [ -n "$CATALOG" ]; then echo "BUNDLE_VAR_catalog=$CATALOG" >> "$GITHUB_ENV"; fi
          if [ -n "$SCHEMA" ]; then echo "BUNDLE_VAR_schema=$SCHEMA" >> "$GITHUB_ENV"; fi
      - name: Validate the bundle
        run: databricks bundle validate --target prod
      - name: Seed example data (only when SEED_EXAMPLE_DATA is true)
        if: vars.SEED_EXAMPLE_DATA == 'true'
        run: python scripts/seed_demo_data.py --target prod
      - name: Plan
        run: scripts/plan.sh prod
      - name: Redacted copy of the plan for review (the alert address is removed)
        run: jq 'walk(if type == "object" and has("email_notifications") then .email_notifications = "<redacted>" else . end)' plan-prod.json > plan-prod-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan-prod
          path: plan-prod-review.json
          retention-days: 30
      - name: Deploy the plan to prod
        run: databricks bundle deploy --target prod --plan plan-prod.json --auto-approve
      - name: Post-deployment benchmark check on prod data
        # The staging gate tested staging data; this run tests the agent on prod data and emails the team if it
        # fails. Run it again any time with the "Genie Agent benchmarks" workflow (on demand, no schedule).
        run: scripts/run_gate.sh prod
